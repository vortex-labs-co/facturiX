<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Facturix{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0A0C13; color: #FAF0E8; }
    .navbar { background: #0A0C13 !important; border-bottom: 1px solid #8F2600; }
    .navbar-brand { color: #B02F00 !important; }
    .btn-primary { background: #B02F00; border-color: #B02F00; }
    .btn-primary:hover { background: #8F2600; border-color: #8F2600; }
    .btn-outline-info { color: #00628C; border-color: #00628C; }
    .btn-outline-info:hover { background: #00628C; color: #FAF0E8; }
    .card { background: #271813; color: #FDF3EC; border: 1px solid #8F260055; }
    .table-dark { --bs-table-bg: #271813; }
    input, select, textarea { background: #0A0C13 !important; color: #FAF0E8 !important; border-color: #565E74 !important; }
    a { color: #00628C; }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <nav class="navbar navbar-dark px-3">
    <span class="navbar-brand fw-bold" style="color:#3aa7d0">Facturix</span>
    <div>
      <a class="btn btn-sm btn-outline-light me-1" href="{% url 'dashboard' %}">Inicio</a>
      <a class="btn btn-sm btn-outline-light me-1" href="{% url 'cliente_lista' %}">Clientes</a>
      <a class="btn btn-sm btn-outline-light me-1" href="{% url 'contrato_lista' %}">Contratos</a>
      <a class="btn btn-sm btn-outline-light me-1" href="{% url 'factura_lista' %}">Facturas</a>
      <a class="btn btn-sm btn-outline-light me-1" href="{% url 'cuenta_lista' %}">Cuentas</a>
      <a class="btn btn-sm btn-outline-light me-1" href="{% url 'gasto_lista' %}">Gastos</a>
      <a class="btn btn-sm btn-outline-light me-1" href="{% url 'informe' %}">Informe</a>
      <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}
        <button class="btn btn-outline-light btn-sm">Salir</button>
      </form>
    </div>
  </nav>
  {% endif %}
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
