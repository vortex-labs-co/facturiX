<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Facturix{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #F7F8FA; color: #0A0C13; font-family: 'Segoe UI', system-ui, sans-serif; }
    .sidebar { position: fixed; top: 0; left: 0; width: 230px; height: 100vh; background: #0A0C13; padding: 1.2rem; }
    .sidebar .brand { color: #B02F00; font-weight: 800; font-size: 1.4rem; letter-spacing: .5px; margin-bottom: 1.5rem; display:block; text-decoration:none; }
    .sidebar a.navlink { display: block; color: #cbd2e1; text-decoration: none; padding: .55rem .8rem; border-radius: .5rem; margin-bottom: .25rem; }
    .sidebar a.navlink:hover { background: #271813; color: #FAF0E8; }
    .main { margin-left: 230px; padding: 2rem; }
    .card { background: #fff; color: #0A0C13; border: 1px solid #e8e4de; border-radius: .9rem; box-shadow: 0 2px 8px rgba(39,24,19,.06); }
    .card h6 { color: #565E74; text-transform: uppercase; font-size: .75rem; letter-spacing: .5px; }
    .card h3 { font-weight: 800; }
    .btn-primary { background: #B02F00; border-color: #B02F00; border-radius: .6rem; }
    .btn-primary:hover { background: #8F2600; border-color: #8F2600; }
    .btn-outline-info, .btn-outline-success { border-radius: .6rem; }
    .table { background: #fff; border-radius: .9rem; overflow: hidden; box-shadow: 0 2px 8px rgba(39,24,19,.06); }
    .table thead { background: #FAF0E8; }
    input, select, textarea { border-radius: .6rem !important; border-color: #d8d2c8 !important; }
    a { color: #00628C; }
    h4 { font-weight: 800; }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <aside class="sidebar">
    <a class="brand" href="{% url 'dashboard' %}">Facturix</a>
    <a class="navlink" href="{% url 'dashboard' %}">🏠 Inicio</a>
    <a class="navlink" href="{% url 'cliente_lista' %}">👥 Clientes</a>
    <a class="navlink" href="{% url 'contrato_lista' %}">📄 Contratos</a>
    <a class="navlink" href="{% url 'factura_lista' %}">🧾 Facturas</a>
    <a class="navlink" href="{% url 'cuenta_lista' %}">💰 Cuentas</a>
    <a class="navlink" href="{% url 'gasto_lista' %}">📉 Gastos</a>
    <a class="navlink" href="{% url 'informe' %}">📊 Informe</a>
    <form method="post" action="{% url 'logout' %}" class="mt-3">{% csrf_token %}
      <button class="btn btn-outline-light btn-sm w-100">Salir</button>
    </form>
  </aside>
  <div class="main">
  {% else %}
  <div class="main" style="margin-left:0">
  {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
