{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>Gastos</h4>
  <a href="{% url 'gasto_crear' %}" class="btn btn-primary">Nuevo</a>
</div>
<table class="table table-hover">
  <thead><tr><th>Descripción</th><th>Valor</th><th>Fecha</th><th>Archivo</th></tr></thead>
  <tbody>
  {% for g in gastos %}<tr><td>{{ g.descripcion }}</td><td>${{ g.valor }}</td><td>{{ g.fecha }}</td><td><a href="{{ g.archivo.url }}">Ver</a></td></tr>
  {% empty %}<tr><td colspan="4">Sin gastos</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
