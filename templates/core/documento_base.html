<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>{% block title_doc %}Documento{% endblock %} - Vortex Labs</title>
<style>
:root { --primary:#B02F00; --primary-dark:#8F2600; --primary-light:#FFF4ED; --secondary:#0F172A; --text:#334155; --border:#E2E8F0; }
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',system-ui,sans-serif; color:#334155; background:#F8FAFC; line-height:1.6; padding:30px 15px; }
.document-container { max-width:860px; margin:0 auto; background:#fff; padding:50px 60px; border-radius:12px; border:1px solid var(--border); }
.header { display:flex; justify-content:space-between; align-items:center; background:#0A0C13; padding:24px 30px; border-radius:8px; margin-bottom:35px; }
.brand-title { font-size:34px; font-weight:900; letter-spacing:-1px; color:#FAF0E8; text-transform:uppercase; }
.brand-title span { color:#B02F00; display:inline-block; transform:skewX(-6deg); margin-left:-6px; letter-spacing:-2px; }
.brand-sub { font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:#565E74; }
.doc-meta { text-align:right; font-size:12px; color:#cbd2e1; }
.doc-meta strong { color:#FAF0E8; font-size:13px; }
.contract-title-area { text-align:center; margin-bottom:30px; }
.contract-title-area h1 { font-size:22px; text-transform:uppercase; color:#0F172A; margin-bottom:6px; }
.contract-num { display:inline-block; background:#FFF4ED; color:#8F2600; font-weight:700; padding:4px 14px; border-radius:999px; font-size:13px; border:1px solid rgba(255,102,0,.25); }
.clause { margin-bottom:24px; text-align:justify; font-size:14px; }
table { width:100%; border-collapse:collapse; font-size:13px; margin:15px 0; }
th { background:#F1F5F9; color:#0F172A; padding:10px 14px; text-transform:uppercase; font-size:12px; border-bottom:1px solid var(--border); }
td { padding:10px 14px; border-bottom:1px solid var(--border); }
.total-row { background:#FFF4ED; font-weight:700; }
@media print { body { background:#fff; padding:0; } .document-container { border:none; } }
</style>
</head>
<body>
<div class="document-container">
  <header class="header">
    <div>
      <div class="brand-title">VRT<span>X</span></div>
      <div class="brand-sub">Vortex Labs S.A.S.</div>
    </div>
    <div class="doc-meta">
      <p><strong>NIT:</strong> 902.104.421-7</p>
      <p><strong>Régimen:</strong> Régimen Simple de Tributación</p>
      <p><strong>Medellín, Antioquia - Colombia</strong></p>
    </div>
  </header>
  <div class="contract-title-area">
    <h1>{% block titulo_doc %}Documento{% endblock %}</h1>
    <span class="contract-num">{% block numero_doc %}{% endblock %}</span>
  </div>
  {% block contenido %}{% endblock %}
</div>
</body>
</html>
