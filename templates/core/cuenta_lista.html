{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>Cuentas de cobro</h4>
  <a href="{% url 'cuenta_crear' %}" class="btn btn-primary">Nueva</a>
  <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary ms-2">Inicio</a>
</div>
<table class="table table-hover">
  <thead><tr><th>Descripción</th><th>Cliente</th><th>Valor</th><th>Fecha</th><th>Archivo</th></tr></thead>
  <tbody>
  {% for c in cuentas %}<tr><td>{{ c.descripcion }}</td><td>{{ c.cliente.nombre }}</td><td>${{ c.valor }}</td><td>{{ c.fecha }}</td><td><a href="{% url 'cuenta_vista' c.pk %}" class="btn btn-sm btn-outline-success">Vista</a> <a href="{{ c.archivo.url }}" class="btn btn-sm btn-outline-light">Ver</a></td></tr>
  {% empty %}<tr><td colspan="5">Sin cuentas</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
