{% extends 'base.html' %}
{% block content %}
<div class="card p-4">
  <h4>🗑️ ¿Eliminar registro?</h4>
  <p>Vas a eliminar: <strong>{{ obj }}</strong></p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Sí, eliminar</button>
    <a href="javascript:history.back()" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
